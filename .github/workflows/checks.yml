name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py panel.py
      - name: Check application startup
        env:
          DATABASE_PATH: ${{ runner.temp }}/interview_app.sqlite3
        run: python -c "from app import app; assert any(route.path == '/healthz' for route in app.routes)"
